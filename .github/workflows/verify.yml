name: Verify Songcrumb
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public source hygiene
        run: python3 Scripts/check_public.py
      - name: Verify native logic and browser bridge
        run: |
          node --version
          ./Scripts/test.sh
      - name: Build shared Xcode scheme
        run: xcodebuild -project Songcrumb.xcodeproj -scheme Songcrumb -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build/Xcode CODE_SIGN_IDENTITY=- build
